# Remote database (primary): layered over the base Compose file by scripts/compose-up.sh
# and scripts/run-etl.sh when the hosted database is selected. The local db service
# remains running as a fallback and as the migration target.
services:
  api:
    environment:
      DATABASE_CONNECTION_STRING: ${REMOTE_DATABASE_CONNECTION_STRING}
  etl:
    environment:
      DATABASE_CONNECTION_STRING: ${REMOTE_DATABASE_CONNECTION_STRING}
