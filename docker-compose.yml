name: neighborhood-explorer

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-explorer}
      POSTGRES_USER: ${POSTGRES_USER:-explorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_CONNECTION_STRING: Host=db;Database=${POSTGRES_DB:-explorer};Username=${POSTGRES_USER:-explorer};Password=${POSTGRES_PASSWORD:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://clef:8080}
      AI_MODEL: ${AI_MODEL:-clef-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-10}
      ISOCHRONE_PROVIDER: ${ISOCHRONE_PROVIDER:-fake}
      ISOCHRONE_API_KEY: ${ISOCHRONE_API_KEY:-}
      ISOCHRONE_DAILY_BUDGET: ${ISOCHRONE_DAILY_BUDGET:-1000}
    ports:
      - "127.0.0.1:5080:8080"

  etl:
    build: ./backend
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_CONNECTION_STRING: Host=db;Database=${POSTGRES_DB:-explorer};Username=${POSTGRES_USER:-explorer};Password=${POSTGRES_PASSWORD:-}
      ISOCHRONE_PROVIDER: ${ISOCHRONE_PROVIDER:-fake}
      ISOCHRONE_API_KEY: ${ISOCHRONE_API_KEY:-}
      ISOCHRONE_DAILY_BUDGET: ${ISOCHRONE_DAILY_BUDGET:-1000}
    volumes:
      - ./data:/data
    entrypoint: ["dotnet", "Etl.dll"]

  clef:
    build:
      context: ./infra/clef
      args:
        LLAMA_COMMIT: ${CLEF_LLAMA_COMMIT:-}
    profiles: ["ai"]
    environment:
      QUANT: ${CLEF_QUANT:-Q4_K_M}
    volumes:
      - clef-models:/models
    ports:
      - "127.0.0.1:8090:8080"
    mem_limit: ${CLEF_MEMORY_LIMIT:-12g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15m
    restart: unless-stopped

volumes:
  pgdata:
  clef-models:
